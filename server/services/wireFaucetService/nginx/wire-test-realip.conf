# Кладётся в /etc/nginx/conf.d/ — это http-контекст, отдельно от прода.
# Определяет $wire_client_ip: настоящий IP клиента для лимита регистраций.
#
# Путь запроса: клиент -> Cloudflare -> LB 65.109.128.4 -> ex44.
# В nginx.conf стоит `set_real_ip_from 65.109.128.4` без `real_ip_recursive`,
# поэтому $remote_addr становится ПОСЛЕДНИМ элементом X-Forwarded-For — а его
# дописывает LB, и это IP Cloudflare, а не клиента. Настоящий IP приходит
# в CF-Connecting-IP.

# Пустой CF-Connecting-IP (запрос не из-за Cloudflare) -> откат на $remote_addr.
map $http_cf_connecting_ip $wire_cf_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# CF-Connecting-IP доверяем ТОЛЬКО если запрос физически пришёл с LB.
# $realip_remote_addr — исходный peer, до подмены модулем realip.
# При прямом обращении по IP сервера заголовок игнорируется, иначе лимит
# обходился бы одной строчкой в curl.
map $realip_remote_addr $wire_client_ip {
    default        $remote_addr;
    "65.109.128.4" $wire_cf_ip;
}
