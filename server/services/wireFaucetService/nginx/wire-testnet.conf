# Подключается изнутри server-блока .alcor.exchange:
#   include /etc/nginx/snippets/wire-testnet.conf;
#
# POST https://alcor.exchange/api/v2/wire-test/register  ->  127.0.0.1:3100/register

# ^~ обязателен: без него запрос перехватит regex-локация ~ ^/api/v[23]/,
# которая уходит на $api_upstream. Префикс с ^~ имеет приоритет над regex.
location ^~ /api/v2/wire-test/ {
    # CORS. Фронт биржи живёт на другом origin (localhost:3000 в разработке,
    # alcor.exchange в проде), а JSON-тело заставляет браузер сперва послать
    # preflight. Без заголовков ниже запрос не покидает вкладку: OPTIONS
    # возвращал 200 без Access-Control-Allow-Origin, и fetch падал с
    # "Failed to fetch" ещё до отправки тела. Через curl это не видно —
    # CORS проверяет только браузер.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "content-type";
        add_header Access-Control-Max-Age       86400;
        add_header Content-Length               0;
        return 204;
    }

    # always — иначе заголовок не попадёт в 400/429/502, и вместо внятного
    # "лимит по IP" фронт снова увидит безликое "Failed to fetch".
    add_header Access-Control-Allow-Origin "*" always;

    # Слеш на конце срезает префикс: /api/v2/wire-test/register -> /register
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;

    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # Ровно один адрес и перезаписью, а НЕ $proxy_add_x_forwarded_for: иначе
    # клиент пришлёт свой X-Forwarded-For, nginx допишет реальный IP в конец,
    # а бек читает первый элемент — и лимит обходится одним заголовком.
    # $wire_client_ip определён в conf.d/wire-test-realip.conf.
    proxy_set_header X-Forwarded-For    $wire_client_ip;

    # Регистрация — это две транзакции плюс ожидание аккаунта в цепи.
    proxy_read_timeout 120s;
    proxy_connect_timeout 15s;
}
